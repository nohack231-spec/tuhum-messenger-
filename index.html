<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7651c8">
  <title>tuhum chat — по-нашому</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121019;
      color: #f3f0f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .screen {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      background: #1a1724;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }
    @media(min-width: 481px) {
      .screen { border-radius: 24px; height: 90vh; }
    }
    
    /* Екран входу */
    #auth-screen {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex: 1;
    }
    .logo { font-size: 28px; font-weight: bold; color: #b18aff; margin-bottom: 8px; }
    .subtitle { color: #a9a2b8; margin-bottom: 30px; font-size: 14px; }
    .input-box {
      width: 100%;
      background: #252135;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .input-box label { display: block; font-size: 12px; color: #a9a2b8; margin-bottom: 6px; }
    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      outline: none;
    }
    .btn {
      width: 100%;
      background: #7651c8;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #8762d9; }

    /* Головний екран */
    #main-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }
    header {
      background: #7651c8;
      padding: 20px;
      color: white;
      border-radius: 0 0 24px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 20px; font-weight: bold; }
    .group-create-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .search-container { padding: 15px 20px 5px; }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: #252135;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .section-title { padding: 10px 20px; font-size: 12px; color: #a9a2b8; text-transform: uppercase; letter-spacing: 1px; }
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 20px;
    }
    .user-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 6px;
      background: #231f30;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-item:hover { background: #2d283d; }
    .avatar {
      width: 42px; height: 42px;
      background: #7651c8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 15px;
    }
    .user-info .name { font-weight: bold; font-size: 16px; }
    .user-info .status { font-size: 12px; color: #4ade80; margin-top: 2px; }

    .footer-actions { padding: 15px 20px; border-top: 1px solid #252135; }

    /* ЕКРАН ЧАТУ (ПЕРЕПИСКА) */
    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      word-break: break-word;
    }
    .message.incoming {
      background: #252135;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message.outgoing {
      background: #7651c8;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message .sender {
      font-size: 11px;
      color: #b18aff;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .chat-input-box {
      padding: 12px 15px;
      background: #1a1724;
      border-top: 1px solid #252135;
      display: flex;
      gap: 10px;
    }
    .chat-input-box input {
      flex: 1;
      background: #252135;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      color: white;
      outline: none;
      font-size: 14px;
    }
    .chat-input-box button {
      background: #7651c8;
      border: none;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Модальне вікно створення групи */
    #modal-group {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }
    .modal-content {
      background: #1a1724;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #2d283d;
    }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #b18aff; }
    .checkbox-list { max-height: 150px; overflow-y: auto; margin: 15px 0; background: #121019; padding: 10px; border-radius: 10px; }
    .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
    .checkbox-item input { margin-right: 10px; accent-color: #7651c8; }
  </style>
</head>
<body>

  <div class="screen">
    <!-- ЕКРАН 1: ВХІД -->
    <div id="auth-screen">
      <div class="logo">✦ tuhum chat</div>
      <div class="subtitle">Здоровенькі були! Заходьте на говірку.</div>

      <div class="input-box">
        <label>Як тебе величають (Ім'я):</label>
        <input type="text" id="username-input" value="Поліщук">
      </div>

      <button class="btn" id="login-btn">Зайти у хату</button>
    </div>

    <!-- ЕКРАН 2: СПИСОК -->
    <div id="main-screen">
      <header>
        <div class="header-title" id="header-username">tuhum chat</div>
        <button class="group-create-btn" id="open-group-modal">＋ Група</button>
      </header>

      <div class="search-container">
        <input type="text" class="search-input" id="search-input" placeholder="Шукати своїх...">
      </div>

      <div class="section-title">Чати та люди на хуторі</div>
      <div class="users-list" id="users-container"></div>

      <div class="footer-actions">
        <button class="btn" id="logout-btn" style="background: #3a324f;">Вийти з хати</button>
      </div>
    </div>

    <!-- ЕКРАН 3: ПЕРЕПИСКА (ЧАТ) -->
    <div id="chat-screen">
      <header>
        <button class="group-create-btn" id="back-to-main">← Назад</button>
        <div class="header-title" id="active-chat-title">Назва чату</div>
        <div style="width: 50px;"></div>
      </header>
      
      <div class="chat-messages" id="chat-messages-container">
        <!-- Повідомлення чату -->
      </div>

      <div class="chat-input-box">
        <input type="text" id="message-input" placeholder="Написати говірку...">
        <button id="send-msg-btn">➤</button>
      </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО СТВОРЕННЯ ГРУПИ -->
    <div id="modal-group">
      <div class="modal-content">
        <div class="modal-title">Створити нову ватагу (групу)</div>
        <div class="input-box" style="margin-bottom: 10px;">
          <label>Назва групи:</label>
          <input type="text" id="group-name-input" placeholder="Наприклад: За Случчю">
        </div>
        <div style="font-size: 12px; color: #a9a2b8; margin-top: 10px;">Оберіть учасників:</div>
        <div class="checkbox-list" id="group-users-checkboxes"></div>
        <button class="btn" id="save-group-btn" style="margin-top: 10px;">Створити</button>
        <button class="btn" id="close-group-modal" style="background: #2d283d; margin-top: 8px;">Скасувати</button>
      </div>
    </div>
  </div>

  <!-- ЛОГІКА ТА FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "tuhum-messenger-5279e.firebaseapp.com",
      projectId: "tuhum-messenger-5279e",
      storageBucket: "tuhum-messenger-5279e.appspot.com",
      messagingSenderId: "451891692791",
      appId: "1:451891692791:web:c0db0013b151fb79ecff2",
      measurementId: "G-T0M6CBC8XY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const chatScreen = document.getElementById('chat-screen');
    
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const usernameInput = document.getElementById('username-input');
    const headerUsername = document.getElementById('header-username');
    const usersContainer = document.getElementById('users-container');
    const searchInput = document.getElementById('search-input');

    const modalGroup = document.getElementById('modal-group');
    const openGroupModalBtn = document.getElementById('open-group-modal');
    const closeGroupModalBtn = document.getElementById('close-group-modal');
    const saveGroupBtn = document.getElementById('save-group-btn');
    const groupNameInput = document.getElementById('group-name-input');
    const groupUsersCheckboxes = document.getElementById('group-users-checkboxes');

    const backToMainBtn = document.getElementById('back-to-main');
    const activeChatTitle = document.getElementById('active-chat-title');
    const chatMessagesContainer = document.getElementById('chat-messages-container');
    const messageInput = document.getElementById('message-input');
    const sendMsgBtn = document.getElementById('send-msg-btn');

    let allUsers = [];
    let currentUsername = localStorage.getItem('tuhum_username') || '';
    let currentChatId = null;
    let unsubscribeMessages = null;

    if (currentUsername) {
      enterApp(currentUsername);
    }

    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      if (!username) {
        alert('Та кажи вже своє ім\'я!');
        return;
      }
      currentUsername = username;
      localStorage.setItem('tuhum_username', username);

      try {
        await setDoc(doc(db, "users", username), {
          username: username,
          lastLogin: serverTimestamp(),
          status: "на зв'язку"
        }, { merge: true });
        enterApp(username);
      } catch (err) {
        console.error("Помилка:", err);
        alert("Щось зв'язок підводить, не вдалося зайти.");
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('tuhum_username');
      mainScreen.style.display = 'none';
      authScreen.style.display = 'flex';
    });

    async function enterApp(username) {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
      headerUsername.textContent = `Здоров, ${username} 💜`;
      loadData();
    }

    async function loadData() {
      usersContainer.innerHTML = '<div style="text-align:center; color: #a9a2b8; padding: 20px;">Шукаємо людей і ватаги...</div>';
      try {
        const usersSnapshot = await getDocs(collection(db, "users"));
        allUsers = [];
        usersSnapshot.forEach((docSnap) => {
          const userData = docSnap.data();
          if (userData.username !== currentUsername) {
            allUsers.push({ type: 'user', id: userData.username, ...userData });
          }
        });

        const chatsSnapshot = await getDocs(collection(db, "chats"));
        let chats = [];
        chatsSnapshot.forEach((docSnap) => {
          const chatData = docSnap.data();
          if (chatData.members && chatData.members.includes(currentUsername)) {
            chats.push({ type: 'group', id: docSnap.id, ...chatData });
          }
        });

        renderList([...chats, ...allUsers]);
      } catch (err) {
        console.error("Помилка завантаження:", err);
      }
    }

    function renderList(items) {
      if (items.length === 0) {
        usersContainer.innerHTML = '<div style="text-align:center; color: #a9a2b8; padding: 20px;">Поки що нікого немає на хуторі :(</div>';
        return;
      }

      usersContainer.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'user-item';
        
        if (item.type === 'group') {
          div.innerHTML = `
            <div class="avatar" style="background: #a855f7;">👥</div>
            <div class="user-info">
              <div class="name">${item.name}</div>
              <div class="status">група</div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="avatar">${item.username.charAt(0).toUpperCase()}</div>
            <div class="user-info">
              <div class="name">${item.username}</div>
              <div class="status">на зв'язку</div>
            </div>
          `;
        }

        div.addEventListener('click', () => {
          openChat(item);
        });
        usersContainer.appendChild(div);
      });
    }

    // Відкриття екрана чату
    async function openChat(item) {
      mainScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      chatMessagesContainer.innerHTML = '';

      if (item.type === 'group') {
        currentChatId = item.id;
        activeChatTitle.textContent = item.name;
      } else {
        // Для ЛС створюємо унікальний ID чату з комбінації імен
        const sortedNames = [currentUsername, item.username].sort();
        currentChatId = `private_${sortedNames[0]}_${sortedNames[1]}`;
        activeChatTitle.textContent = item.username;
      }

      // Слухаємо повідомлення в реальному часі через Firestore onSnapshot
      const q = query(collection(db, "messages"), where("chatId", "==", currentChatId));
      
      if (unsubscribeMessages) unsubscribeMessages();

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        let msgs = [];
        snapshot.forEach((doc) => {
          msgs.push({ id: doc.id, ...doc.data() });
        });
        
        // Сортуємо вручну за часом
        msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

        chatMessagesContainer.innerHTML = '';
        msgs.forEach(msg => {
          const msgDiv = document.createElement('div');
          const isOutgoing = msg.sender === currentUsername;
          msgDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
          
          let htmlContent = '';
          if (!isOutgoing) {
            htmlContent += `<div class="sender">${msg.sender}</div>`;
          }
          htmlContent += `<div>${msg.text}</div>`;
          msgDiv.innerHTML = htmlContent;
          chatMessagesContainer.appendChild(msgDiv);
        });
        chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
      });
    }

    backToMainBtn.addEventListener('click', () => {
      if (unsubscribeMessages) unsubscribeMessages();
      chatScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
      loadData();
    });

    // Надсилання повідомлення
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentChatId) return;

      try {
        messageInput.value = '';
        await addDoc(collection(db, "messages"), {
          chatId: currentChatId,
          sender: currentUsername,
          text: text,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Помилка надсилання:", err);
      }
    }

    sendMsgBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Модалка створення групи
    openGroupModalBtn.addEventListener('click', () => {
      groupNameInput.value = '';
      groupUsersCheckboxes.innerHTML = '';
      allUsers.forEach(u => {
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.innerHTML = `<input type="checkbox" value="${u.username}"> ${u.username}`;
        groupUsersCheckboxes.appendChild(label);
      });
      modalGroup.style.display = 'flex';
    });

    closeGroupModalBtn.addEventListener('click', () => {
      modalGroup.style.display = 'none';
    });

    saveGroupBtn.addEventListener('click', async () => {
      const groupName = groupNameInput.value.trim();
      if (!groupName) {
        alert('Дай назву групі!');
        return;
      }

      const checkboxes = groupUsersCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
      const selectedMembers = [currentUsername];
      checkboxes.forEach(cb => selectedMembers.push(cb.value));

      try {
        await addDoc(collection(db, "chats"), {
          name: groupName,
          members: selectedMembers,
          createdAt: serverTimestamp()
        });
        modalGroup.style.display = 'none';
        loadData();
      } catch (err) {
        console.error("Помилка створення групи:", err);
      }
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allUsers.filter(u => u.username.toLowerCase().includes(term));
      // Можна додати фільтрацію відображення списку тут за бажанням
    });
  </script>
</body>
</html>
